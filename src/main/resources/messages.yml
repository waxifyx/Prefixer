prefix: "<gold>Prefixer <dark_gray>| <reset>"

messages:
  reload-success: "<green>Reloaded configuration and messages."
  no-permission: "<red>You do not have permission."
  player-only: "<red>This command needs player sender when no target is given."
  player-not-found: "<red>Player <yellow>{player}</yellow> not found."
  invalid-type: "<red>Invalid type <yellow>{type}</yellow>."
  image-not-yet-implemented: "<red>Image prefixes and suffixes not implemented in this build yet."
  image-processing: "<yellow>Processing image for {kind}. This may take moment."
  image-source-missing: "<red>Image type needs image source and fallback text."
  image-command-usage: "<red>Image usage: <yellow>image <source> fallback <text></yellow> or <yellow>image <source> shadow <color> fallback <text></yellow>."
  invalid-shadow-color: "<red>Shadow must be <yellow>none</yellow>, <yellow>#RRGGBB</yellow>, or <yellow>#RRGGBBAA</yellow>."
  text-style-not-allowed: "<red>You cannot use styled text for this {kind}."
  image-invalid-dimensions: "<red>Image must be 8 pixels high and width must be multiple of 8."
  image-has-transparency: "<red>Image transparency is not allowed."
  image-fetch-failed: "<red>Could not load image source."
  mineskin-misconfigured: "<red>MineSkin API key not configured."
  invalid-command-usage: "<red>Invalid command usage. Quote values with spaces. To target others, use explicit type after player name."
  cooldown-active: "<red>You must wait <yellow>{duration}</yellow> before changing your {kind} again."
  max-length: "<red>Your {kind} cannot be longer than <yellow>{length}</yellow> characters."
  regex-failed: "<red>Your {kind} contains disallowed characters."
  missing-value: "<red>You must provide value."
  set-self: "<green>Set your {kind} to <white>{value}</white>."
  set-other: "<green>Set {player}'s {kind} to <white>{value}</white>."
  cleared-self: "<green>Cleared your {kind}."
  cleared-other: "<green>Cleared {player}'s {kind}."
  storage-error: "<red>Storage operation failed. Check console."
  luckperms-error: "<red>LuckPerms sync failed. Check console."
  discord-not-whitelisted: "You are not allowed to use Prefixer Discord commands."
  discord-player-not-found: "Minecraft player `{player}` not found online."
  discord-command-synced: "Synced Discord slash commands."
  discord-command-disabled: "Discord integration disabled or token missing."
